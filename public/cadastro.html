<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro | 📦 Estoque Braga</title>
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body class="pagina-login">
  <div class="cartao caixa-login">
    <div class="icone">📦</div>
    <h1>Estoque Braga</h1>
    <p class="subtitulo">Crie sua conta</p>
    <form id="form-cadastro">
      <label for="nome">Nome</label>
      <input type="text" id="nome" placeholder="Seu nome" required>
      <label for="email">E-mail</label>
      <input type="email" id="email" placeholder="seuemail@exemplo.com" required>
      <label for="senha">Senha</label>
      <input type="password" id="senha" placeholder="Digite sua senha" required>
      <label for="tipo">Perfil</label>
      <select id="tipo" required>
        <option value="operador">Operador</option>
        <option value="administrador">Administrador</option>
      </select>
      <button type="submit" class="botao">Cadastrar</button>
    </form>
    <p id="mensagem" class="mensagem"></p>
    <p class="mensagem"><a href="index.html">Voltar para entrar</a> · <a href="sobre.html">Sobre</a></p>
  </div>
  <footer class="rodape">Estoque Braga © 2026 | Pedro do Nascimento Braga | Turma 996</footer>
  <script src="js/comum.js"></script>
  <script src="js/cadastro.js"></script>
</body>
</html>
