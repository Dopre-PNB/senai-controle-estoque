<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar | 📦 Estoque Braga</title>
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body class="pagina-login">
  <div class="cartao caixa-login">
    <div class="icone">📦</div>
    <h1>Estoque Braga</h1>
    <p class="subtitulo">Entre com seu e-mail e senha</p>
    <form id="form-login">
      <label for="email">E-mail</label>
      <input type="email" id="email" placeholder="seuemail@exemplo.com" required>
      <label for="senha">Senha</label>
      <input type="password" id="senha" placeholder="Digite sua senha" required>
      <button type="submit" class="botao">Entrar</button>
    </form>
    <p id="mensagem" class="mensagem"></p>
    <p class="mensagem"><a href="cadastro.html">Criar conta</a> · <a href="sobre.html">Sobre</a></p>
  </div>
  <footer class="rodape">Estoque Braga © 2026 | Pedro do Nascimento Braga | Turma 996</footer>
</body>
</html>
